# CAuDri - OpenOCD config for the Hardware Interface
#
# Must be passed as an argument when calling openocd in the command line.
# e.g. openocd -f openocd.cfg -c "program HardwareInterface.elf verify reset exit"
#
# This will be used by all build script shell commands (e.g. build, flash).


### Uncomment the following lines if you are using a ST-Link v2 or v3 debugger ###
source [find interface/stlink.cfg]
transport select hla_swd


### Uncomment the following lines if you are using a CMSIS-DAP debugger ###
# source [find interface/cmsis-dap.cfg]
# transport select swd
# adapter speed 4000


source [find target/stm32f4x.cfg]
# reset_config srst_only srst_nogate connect_assert_srst
$_TARGETNAME configure -rtos auto
